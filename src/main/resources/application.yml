server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mc_create}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    # 数据库密码从环境变量读取，切勿把真实密码写进仓库
    # 本地运行：设置环境变量 DB_PASSWORD，或在 IDE 的 Run Configuration 里配置
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true   # 数据库下划线列名 -> Java 驼峰字段
    # 注意：不要长期开启 StdOutImpl。它会把每条 SQL 和“完整结果集”直接打印到控制台，
    # 而头像/封面/皮肤数据都是 base64 LONGTEXT（动辄几百 KB~几 MB），
    # 打开后控制台会被巨量数据刷屏。只有排查 SQL 时再临时放开下面这行。
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    # 正常运行时保持 info；需要看 SQL 时再临时改成 debug
    com.mc.create: info

# JWT 配置
jwt:
  # HS256 签名密钥，长度必须 >= 32 字节（生产环境请改成自己的随机串，切勿公开）
  # 从环境变量 JWT_SECRET 读取；未设置时使用下面的开发用默认值（仅限本地）
  secret: ${JWT_SECRET:mc-create-dev-only-insecure-secret-key-change-me-0001}
  # 令牌有效期（秒）：2 小时
  expire: 7200
